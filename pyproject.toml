[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone"
version = "0.0.1"
description = "Agentic AI capstone: factory simulator + research agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
dev = ["pre-commit>=4", "pytest>=8", "pytest-cov>=7", "ruff>=0.16.10"]
database = [
    "SQLAlchemy>=2,<3",
    "alembic>=1.20.0",
    "psycopg[binary]>=3,<4",
    "python-dotenv>=1,<2",
]
agent = [
    "anthropic>=1.0",
    "pydantic-graph>=2.55.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=7",
    "ruff>=0.16.10",
]

[tool.uv]
# Preserve the simulator's installed dependency versions during migration.
constraint-dependencies = [
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "annotated-types==0.8.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.3",
]

[tool.setuptools.packages.find]
include = ["capstone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Optional imports must follow pytest.importorskip in this module.
"tests/test_database_connection.py" = ["E402"]
"tests/test_memory_repository.py" = ["E402"]
