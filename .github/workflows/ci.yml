name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every job installs every optional extra: the agent and database packages
# are extras, and their tests are skipped or fail to import without them.

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Ruff lint
        run: uv run --locked --all-extras ruff check .
      - name: Ruff formatting
        run: uv run --locked --all-extras ruff format --check .
      - name: Every test file belongs to one check
        run: uv run --locked --all-extras python .github/test_groups.py check
      - name: List the checks
        id: groups
        run: echo "names=$(uv run --locked --all-extras python .github/test_groups.py names)" >> "$GITHUB_OUTPUT"

  # One check per part of the project, so a failure names the part.
  tests:
    name: "Tests: ${{ matrix.group }}"
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.lint.outputs.groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Offline tests
        env:
          GROUP: ${{ matrix.group }}
        run: uv run --locked --all-extras pytest $(uv run --locked --all-extras python .github/test_groups.py files "$GROUP")

  # The whole suite in one run: the source of truth, with coverage.
  full:
    name: Full suite and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Offline tests and informational coverage
        run: >-
          uv run --locked --all-extras pytest --cov=capstone --cov-context=test
          --junitxml=junit.xml --cov-report=term-missing
          --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"
      - name: Rebuild evaluation inventories from full per-test coverage
        run: cd evaluation && uv run --locked --all-extras python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Upload regenerated inventories for review
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-inventory
          path: |
            evaluation/inventory/FUNCTION_INVENTORY.json
            evaluation/inventory/TEST_INVENTORY.json
            evaluation/inventory/TOOL_INVENTORY.json
            evaluation/inventory/VERIFICATION_MATRIX.json

  inventory_sync_once:
    name: Commit inventory from validated CI run (temporary)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 196 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/evaluator-full-audit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Check one-time inventory marker
        id: marker
        run: |
          if test -f evaluation/.inventory_sync_requested; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download validated inventory artifact
        if: steps.marker.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: evaluator-inventory
          run-id: 42406716194
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: .inventory-from-ci
      - name: Commit regenerated inventory snapshots
        if: steps.marker.outputs.ready == 'true'
        run: |
          cp .inventory-from-ci/*.json evaluation/inventory/
          rm evaluation/.inventory_sync_requested
          git add evaluation/inventory evaluation/.inventory_sync_requested
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Rebuild evaluator inventory from passing full coverage"
            git push origin HEAD:refs/heads/codex/evaluator-full-audit
          fi
