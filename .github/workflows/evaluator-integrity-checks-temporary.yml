name: Temporary evaluator-integrity patch checks

on:
  push:
    branches: [codex/evaluator-integrity-followup]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --all-extras
      - run: uv run --locked --all-extras ruff check .
      - run: uv run --locked --all-extras ruff format --check .
      - run: uv run --locked --all-extras python .github/test_groups.py check
      - run: >-
          uv run --locked --all-extras pytest
          tests/test_evaluator_integrity.py tests/test_reference_review.py
          tests/test_coverage_reference_edges.py
          tests/test_evaluation_tools.py tests/test_coverage_eval_dispatch.py
