# One-time source-matched evaluator inventory refresh after reconciling PR 288 with main.
# Preserve all safety tests. A bootstrap failure is allowed only for stale inventory scope.
name: PR 288 integrated inventory regeneration
on:
  push:
    branches: [fix/triage-decide-require-verified-clock-20261116]
    paths: [.github/workflows/pr288-integration-inventory.yml]
permissions:
  contents: write
concurrency:
  group: pr288-integration-inventory-final
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/triage-decide-require-verified-clock-20261116
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
      - run: uv python install
      - run: uv sync --locked --all-extras
      - run: uv pip install --python .venv/bin/python -r frontend/requirements-api.txt
      - name: Source-matched coverage bootstrap
        shell: bash
        run: |
          set +e
          uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test \
            --junitxml=junit.xml --cov-report=term-missing > bootstrap.log 2>&1
          status=$?
          set -e
          tail -n 110 bootstrap.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("junit.xml").getroot().iter("testcase")
          failures = [(c.attrib.get("classname", ""), c.attrib.get("name", ""))
                      for c in cases if any(n.tag in {"failure", "error"} for n in c)]
          allowed = {"test_the_repository_has_no_unexplained_python_file"}
          if not failures or any(name not in allowed for _, name in failures):
              raise SystemExit("Non-inventory test failure: " + repr(failures))
          print("Only stale inventory scope failed; building current inventories")
          PY
          fi
      - name: Build first-pass inventory
        run: cd evaluation && uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Verify complete suite with refreshed inventory
        run: uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test --junitxml=junit.xml --cov-report=term-missing
      - name: Build final verified inventory
        run: cd evaluation && uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Commit inventory and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/triage-decide-require-verified-clock-20261116
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo 'Branch changed while regenerating inventories; stop'
            exit 1
          }
          rm .github/workflows/pr288-integration-inventory.yml
          git add -A -- evaluation/inventory/ .github/workflows/pr288-integration-inventory.yml
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(eval): refresh combined PR 288 inventories against current main'
          git push origin HEAD:refs/heads/"$branch"
