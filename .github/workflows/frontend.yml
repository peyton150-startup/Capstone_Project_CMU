name: Industrial frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "capstone-code/capstone/api/**"
      - "tests/test_web_api.py"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  react:
    name: React build and navigation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: TypeScript and production bundle
        working-directory: frontend
        run: npm run build
      - name: Navigation and layout tests
        working-directory: frontend
        run: npm test

  api:
    name: Local API contract and privacy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - name: Install pinned Python
        run: uv python install
      - name: Install locked original dependencies
        run: uv sync --locked --all-extras
      - name: Install optional local API dependencies
        run: uv pip install --python .venv/bin/python -r frontend/requirements-api.txt
      - name: Run API tests against real FastAPI
        run: uv run --no-sync pytest tests/test_web_api.py
