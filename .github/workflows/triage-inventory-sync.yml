# One-time source-and-test inventory rebuild after end-to-end PR #284 hardening.
# Reconciled with latest main; rebuild combined backend and frontend evaluator inventory before merge.
# This branch-restricted workflow deletes itself in its successful commit.
name: One-time triage inventory sync

on:
  push:
    branches: [feature/triage-evidence-boundary-observability]
    paths: [.github/workflows/triage-inventory-sync.yml]

permissions:
  contents: write

jobs:
  inventory:
    if: github.repository == 'peyton150-startup/Capstone_Project_CMU'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/triage-evidence-boundary-observability
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          enable-cache: true
      - name: Install locked dependencies
        run: |
          uv python install
          uv sync --locked --all-extras
      - name: Install frontend API test dependencies
        run: uv pip install --python .venv/bin/python -r frontend/requirements-api.txt
      - name: Generate complete offline per-test coverage
        continue-on-error: true
        run: >-
          uv run --no-sync pytest --cov=capstone --cov=evaltools
          --cov-context=test --junitxml=junit.xml --cov-report=term-missing
      - name: Reject any non-inventory pytest failures
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          cases = ET.parse("junit.xml").getroot().iter("testcase")
          errors = [
              (case, node)
              for case in cases
              for node in case
              if node.tag in {"failure", "error"}
          ]
          for case, failure in errors:
              identity = (
                  case.attrib.get("classname", "") + " " + case.attrib.get("name", "")
              ).lower()
              message = (
                  failure.attrib.get("message", "") + " " + (failure.text or "")
              ).lower()
              # A stale FUNCTION_INVENTORY.json leaves newly added Python
              # files "unexplained" until regeneration. Admit that exact
              # evaluator integrity test, never arbitrary test failures.
              missing_inventory_files = (
                  "tests.test_full_evaluation" in identity
                  and "test_the_repository_has_no_unexplained_python_file" in identity
                  and "unexplained" in message
              )
              known_inventory_mismatch = (
                  ("inventory" in identity or "scope" in identity)
                  and any(
                      phrase in message
                      for phrase in ("inventory", "scope", "sha", "hash")
                  )
              )
              if not (missing_inventory_files or known_inventory_mismatch):
                  raise SystemExit(
                      "Refusing inventory regeneration after non-inventory failure: "
                      + identity
                  )
          if errors:
              print("Only stale evaluator inventory checks failed; proceeding")
          PY
      - name: Rebuild evaluator inventories
        run: cd evaluation && uv run --locked --all-extras python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      # The first suite necessarily sees stale inventories; that one failure
      # must never be recorded as a permanent failed evaluation test. Verify
      # again after rebuilding, then derive final inventories from green JUnit.
      - name: Verify complete offline suite against regenerated inventories
        run: >-
          uv run --no-sync pytest --cov=capstone --cov=evaltools
          --cov-context=test --junitxml=junit.xml --cov-report=term-missing
      - name: Rebuild final inventories from passing test evidence
        run: cd evaluation && uv run --locked --all-extras python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Commit refreshed inventories and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=feature/triage-evidence-boundary-observability
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo 'Branch moved while inventory generated; refusing stale changes'
            exit 1
          }
          rm .github/workflows/triage-inventory-sync.yml
          git add -A -- evaluation/inventory .github/workflows/triage-inventory-sync.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(eval): refresh source-matched triage inventory'
          git push origin HEAD:refs/heads/"$branch"
