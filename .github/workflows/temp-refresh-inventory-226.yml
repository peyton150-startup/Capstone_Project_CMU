# TEMPORARY branch-only workflow to regenerate inventories with genuine CI
# coverage. Remove the workflow file from the PR after its generated
# inventory files are committed.
name: Temporary inventory refresh 226

on:
  push:
    branches:
      - docs/prestige-pilot-readiness-20261110
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  regenerate:
    if: "github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/prestige-pilot-readiness-20261110')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: docs/prestige-pilot-readiness-20261110
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - run: uv python install
      - run: uv sync --locked --all-extras
      - name: Real test evidence for new functions and tests
        run: >-
          uv run --locked --all-extras pytest
          --cov=capstone --cov=evaltools --cov-context=test
          --junitxml=junit.xml
          --cov-report=term-missing
          -k "not test_the_repository_has_no_unexplained_python_file"
      - name: Regenerate inventories using the project's builder
        run: cd evaluation && uv run --locked --all-extras python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Commit generated inventory files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/inventory/FUNCTION_INVENTORY.json evaluation/inventory/TEST_INVENTORY.json evaluation/inventory/TOOL_INVENTORY.json evaluation/inventory/VERIFICATION_MATRIX.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh evaluator inventory for pilot acceptance [inventory-refresh]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
