# One-time inventory regeneration after combining Neon PR290 and Supabase PR289.
name: PR290 integrated evaluation inventory refresh
on:
  push:
    branches: [feature/neon-manual-knowledge-store]
    paths: [.github/workflows/pr290-integrated-inventory.yml]
permissions:
  contents: write
concurrency:
  group: pr290-integrated-eval-once
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/neon-manual-knowledge-store
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
      - run: uv python install
      - run: uv sync --locked --all-extras
      - run: uv pip install --python .venv/bin/python -r frontend/requirements-api.txt
      - name: Source-matched bootstrap coverage
        shell: bash
        run: |
          set +e
          uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test \
            --junitxml=junit.xml --cov-report=term-missing > bootstrap.log 2>&1
          status=$?
          set -e
          tail -n 110 bootstrap.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("junit.xml").getroot().iter("testcase")
          failures = [(c.attrib.get("classname", ""), c.attrib.get("name", ""))
                      for c in cases if any(n.tag in {"failure", "error"} for n in c)]
          allowed = {"test_the_repository_has_no_unexplained_python_file"}
          if not failures or any(name not in allowed for _,name in failures):
              raise SystemExit("Non-inventory test failure: " + repr(failures))
          print("Only stale evaluator file scope failed, continuing regeneration")
          PY
          fi
      - name: Build current source inventory
        run: cd evaluation && uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Verify complete test suite with refreshed inventory
        run: uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test --junitxml=junit.xml --cov-report=term-missing
      - name: Rebuild final inventories from green tests
        run: cd evaluation && uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Commit rebuilt inventory and self-delete
        shell: bash
        run: |
          set -euo pipefail
          branch=feature/neon-manual-knowledge-store
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo 'Newer branch head exists; stale inventory must not be committed'
            exit 1
          }
          rm .github/workflows/pr290-integrated-inventory.yml
          git add -A -- evaluation/inventory/ .github/workflows/pr290-integrated-inventory.yml
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(eval): rebuild PR290 inventory after Supabase integration'
          git push origin HEAD:refs/heads/"$branch"
