# Temporary source-matched inventory refresh for PR #292. Removed in the inventory commit.
name: PR292 source-matched evaluation inventory
on:
  push:
    branches:
      - codex/render-run-persistence
    paths:
      - ".github/workflows/pr292-inventory-refresh.yml"
permissions:
  contents: write
# Keep only the newest source-matched inventory build; stale runs can block
# the required inventory-before-CI gate and consume runner capacity.
concurrency:
  group: pr292-inventory-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/render-run-persistence
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - run: uv python install
      - run: uv sync --locked --all-extras
      - run: uv pip install --python .venv/bin/python -r frontend/requirements-api.txt
      - name: Gather coverage and reject non-inventory test failures
        shell: bash
        run: |
          set +e
          uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test --junitxml=junit.xml --cov-report=term-missing > bootstrap.log 2>&1
          code=$?
          set -e
          tail -n 100 bootstrap.log
          if [ "$code" -ne 0 ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          failures = [(c.attrib.get("classname",""),c.attrib.get("name","")) for c in root.iter("testcase") if any(child.tag in {"failure","error"} for child in c)]
          if not failures or any(name != "test_the_repository_has_no_unexplained_python_file" for _, name in failures):
              raise SystemExit("Non-inventory failures: "+repr(failures))
          print("Only stale inventory scope failed; proceeding to rebuild")
          PY
          fi
      - name: Rebuild full coverage-backed inventory
        run: cd evaluation && uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Verify inventory scope against refreshed source
        run: uv run --no-sync pytest tests/test_full_evaluation.py::test_the_repository_has_no_unexplained_python_file -q
      - name: Verify full suite against rebuilt inventories
        run: uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test --junitxml=junit.xml --cov-report=term-missing
      - name: Generate final inventory from passing evidence
        run: cd evaluation && uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Commit inventory and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/render-run-persistence
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || { echo 'Source moved; refuse stale inventory commit'; exit 1; }
          rm .github/workflows/pr292-inventory-refresh.yml
          git add -A -- evaluation/inventory/ .github/workflows/pr292-inventory-refresh.yml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(eval): rebuild inventories after PR292/main reconciliation'
          git push origin HEAD:refs/heads/codex/render-run-persistence
