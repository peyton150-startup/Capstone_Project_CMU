# One-time PR #285 evaluation-inventory refresh from CURRENT source and tests.
# Final current-source retrigger for PR #285 audit.
# Final acceptance-test inventory refresh triggered after graph/test additions.
# Self-deletes after a verified inventory commit; unrelated failures block sync.
name: One-time PR 285 evaluation inventory refresh

on:
  push:
    branches: [feature/triage-deterministic-hypothesize]
    paths: [.github/workflows/pr285-evaluation-inventory.yml]

concurrency:
  group: triage-pr285-inventory-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'peyton150-startup/Capstone_Project_CMU'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/triage-deterministic-hypothesize
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          enable-cache: true
      - name: Install locked test environment
        run: |
          uv python install
          uv sync --locked --all-extras
      - name: Record coverage and reject substantive test failures
        shell: bash
        run: |
          set +e
          uv run --locked --all-extras pytest --cov=capstone --cov=evaltools \
            --cov-context=test --junitxml=junit.xml --cov-report=term-missing \
            > pr285-inventory-pytest.log 2>&1
          test_result=$?
          set -e
          tail -n 100 pr285-inventory-pytest.log
          if [ "$test_result" -ne 0 ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("junit.xml").getroot()
          failures = [
              case.attrib.get("name", "")
              for case in root.iter("testcase")
              if any(child.tag in {"failure", "error"} for child in case)
          ]
          allowed = {"test_the_repository_has_no_unexplained_python_file"}
          if not failures or any(name not in allowed for name in failures):
              raise SystemExit(
                  "Refusing to regenerate inventory after unrelated test failures: "
                  + str(failures)
              )
          print("Only stale inventory scope was reported; rebuilding from coverage")
          PY
          fi
      - name: Build canonical evaluator inventory from this run
        run: |
          cd evaluation
          uv run --locked --all-extras python -m evaltools.build_inventory \
            --coverage ../.coverage --junit ../junit.xml
      - name: Commit rebuilt inventory and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=feature/triage-deterministic-hypothesize
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo "The PR branch moved during inventory generation; refusing stale push"
            exit 1
          }
          rm .github/workflows/pr285-evaluation-inventory.yml
          git add -A -- evaluation/inventory .github/workflows/pr285-evaluation-inventory.yml
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(eval): refresh PR 285 inventory from current coverage'
          git push origin HEAD:refs/heads/"$branch"
