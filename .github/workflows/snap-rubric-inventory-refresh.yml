name: One-time TL-01 rubric 1.1.1 inventory refresh

on:
  push:
    branches: [codex/snap-tl01-polarity-calibration-fix]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --all-extras
      # The source inventory is deliberately stale when a new evaluator test
      # lands. Capture that first full coverage run even if the scope guard
      # reports the missing entry, rebuild, and rerun the full suite on the
      # refreshed inventory before committing a passing-run snapshot.
      - name: Capture full coverage to bootstrap inventories
        id: bootstrap
        continue-on-error: true
        run: >-
          uv run --locked --all-extras pytest
          --cov=capstone --cov=evaltools --cov-context=test
          --junitxml=junit.xml --cov-report=term-missing
      - name: Bootstrap inventories from captured coverage
        run: cd evaluation && uv run --locked --all-extras python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Verify complete test suite against refreshed inventory
        run: >-
          uv run --locked --all-extras pytest
          --cov=capstone --cov=evaltools --cov-context=test
          --junitxml=junit.xml --cov-report=term-missing
      - name: Rebuild final inventories from passing coverage and JUnit
        run: cd evaluation && uv run --locked --all-extras python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Commit rebuilt inventories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/inventory/FUNCTION_INVENTORY.json evaluation/inventory/TEST_INVENTORY.json evaluation/inventory/TOOL_INVENTORY.json evaluation/inventory/VERIFICATION_MATRIX.json
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh inventories for rubric 1.1.1"
            git push origin HEAD:codex/snap-tl01-polarity-calibration-fix
          fi
