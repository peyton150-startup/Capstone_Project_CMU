# One-time source-matched evaluator inventory refresh for focused PR #288.
# Restrict to this branch, require real test success, and self-remove on success.
name: PR 288 one-time inventory refresh
on:
  push:
    branches: [fix/triage-decide-require-verified-clock-20261116]
    paths: [.github/workflows/pr288-inventory-refresh.yml]
permissions:
  contents: write
concurrency:
  group: pr288-inventory-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/triage-decide-require-verified-clock-20261116
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
      - run: uv python install
      - run: uv sync --locked --all-extras
      - run: uv pip install --python .venv/bin/python -r frontend/requirements-api.txt
      - name: Bootstrap coverage; allow only the stale inventory scope failure
        shell: bash
        run: |
          set +e
          uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test \
            --junitxml=junit.xml --cov-report=term-missing > bootstrap.log 2>&1
          status=$?
          set -e
          tail -n 90 bootstrap.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("junit.xml").getroot().iter("testcase")
          failures = [(c.attrib.get("classname", ""), c.attrib.get("name", ""))
                      for c in cases if any(n.tag in {"failure", "error"} for n in c)]
          allowed = {"test_the_repository_has_no_unexplained_python_file"}
          if not failures or any(name not in allowed for _, name in failures):
              raise SystemExit("Non-inventory test failure: " + repr(failures))
          print("Only stale inventory scope failed; generating current inventory")
          PY
          fi
      - name: Build initial coverage-backed inventory
        run: cd evaluation && uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Verify full suite against refreshed inventories
        run: uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test --junitxml=junit.xml --cov-report=term-missing
      - name: Build final verified inventory
        run: cd evaluation && uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Commit inventories and remove temporary workflow, if head unchanged
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/triage-decide-require-verified-clock-20261116
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo 'Branch advanced during inventory generation; do not overwrite'
            exit 1
          }
          rm .github/workflows/pr288-inventory-refresh.yml
          git add -A -- evaluation/inventory/ .github/workflows/pr288-inventory-refresh.yml
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(eval): regenerate PR 288 source-matched inventories'
          git push origin HEAD:refs/heads/"$branch"
