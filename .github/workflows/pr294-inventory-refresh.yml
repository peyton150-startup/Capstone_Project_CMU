# Temporary branch-only inventory refresh; self-removes after two full green passes.
name: PR 294 source-matched inventory refresh
on:
  push:
    branches:
      - feature/render-safe-complete-triage-progress-20261117
    paths:
      - .github/workflows/pr294-inventory-refresh.yml
permissions:
  contents: write
concurrency:
  group: pr294-inventory-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/render-safe-complete-triage-progress-20261117
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
      - run: uv python install
      - run: uv sync --locked --all-extras
      - run: uv pip install --python .venv/bin/python -r frontend/requirements-api.txt
      - name: Bootstrap test coverage (only inventory scope may fail)
        shell: bash
        run: |
          set +e
          uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test \
            --junitxml=junit.xml --cov-report=term-missing > bootstrap.log 2>&1
          code=$?
          set -e
          tail -n 100 bootstrap.log
          if [ "$code" -ne 0 ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("junit.xml").getroot().iter("testcase")
          failures = [(c.attrib.get("classname", ""), c.attrib.get("name", ""))
                      for c in cases if any(child.tag in {"failure", "error"} for child in c)]
          allowed = {"test_the_repository_has_no_unexplained_python_file"}
          if not failures or any(name not in allowed for _, name in failures):
              raise SystemExit("Non-inventory test failure: " + repr(failures))
          print("Only stale inventory scope failed; continuing to rebuild")
          PY
          fi
      - name: Build coverage-backed source-matched inventory
        run: cd evaluation && uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Verify full suite against new inventory
        run: uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test --junitxml=junit.xml --cov-report=term-missing
      - name: Generate final inventory from verified coverage
        run: cd evaluation && uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Commit inventories and delete this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=feature/render-safe-complete-triage-progress-20261117
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo 'Head changed while testing; refusing stale inventory commit'
            exit 1
          }
          rm .github/workflows/pr294-inventory-refresh.yml
          git add -A -- evaluation/inventory/ .github/workflows/pr294-inventory-refresh.yml
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(eval): refresh source-matched PR 294 inventories'
          git push origin HEAD:refs/heads/"$branch"
