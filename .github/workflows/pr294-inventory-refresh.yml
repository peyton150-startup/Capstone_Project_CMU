# Fast PR294 source-matched inventory rebuild; rerun after ID validation correction.
name: PR 294 source-matched inventory refresh
on:
  push:
    branches:
      - feature/render-safe-complete-triage-progress-20261117
    paths:
      - .github/workflows/pr294-inventory-refresh.yml
permissions:
  contents: write
concurrency:
  group: pr294-inventory-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/render-safe-complete-triage-progress-20261117
          persist-credentials: true
          fetch-depth: 0
      - name: Preserve both PR293 and PR294 changes while resolving reviewed conflicts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Ref changed"; exit 1; }
          git fetch origin main
          echo "MAIN_BASE_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          if ! git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              merge --no-ff --no-commit FETCH_HEAD; then
            python - <<'PY'
          import re
          from pathlib import Path

          # Reviewed conflict choices. Main supplies durable progress replay;
          # PR294 supplies typed safe metrics, frontend rendering, and tests.
          picks = {
              "capstone-code/capstone/api/runs.py": (
                  "ours", "ours", "ours", "ours", "theirs", "ours"
              ),
              "frontend/src/pages/managed.tsx": ("ours", "ours", "ours"),
              "frontend/src/types.ts": ("ours",),
              "tests/test_web_runs.py": ("ours",),
          }
          marker = re.compile(
              r"^<<<<<<< [^\n]*\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]*\n",
              re.MULTILINE | re.DOTALL,
          )
          guard = {
              ("capstone-code/capstone/api/runs.py", 0): "_SAFE_REQUIREMENT_ID",
              ("capstone-code/capstone/api/runs.py", 4): 'progress["latest"]',
              ("capstone-code/capstone/api/runs.py", 5): "latest_observed",
              ("frontend/src/pages/managed.tsx", 0): "SAFE_METRIC_GROUPS",
              ("frontend/src/types.ts", 0): "unresolved_question_count",
              ("tests/test_web_runs.py", 0): "test_render_progress_contract",
          }
          for name, choices in picks.items():
              p = Path(name)
              src = p.read_text()
              hunks = list(marker.finditer(src))
              if len(hunks) != len(choices):
                  raise SystemExit(
                      f"Unexpected conflicts for {name}: {len(hunks)} vs {len(choices)}"
                  )
              chunks, end = [], 0
              for i, (hit, choice) in enumerate(zip(hunks, choices)):
                  part = hit.group(1 if choice == "ours" else 2)
                  required = guard.get((name, i))
                  if required and required not in part:
                      raise SystemExit(f"Unrecognized conflict {name} #{i}: {required}")
                  chunks.extend((src[end:hit.start()], part))
                  end = hit.end()
              chunks.append(src[end:])
              resolved = "".join(chunks)
              if any(m in resolved for m in ("<<<<<<< ", ">>>>>>> ", "\n=======\n")):
                  raise SystemExit(f"Unresolved marker in {name}")
              p.write_text(resolved)
              print(f"Resolved {len(hunks)} reviewed conflict hunks in {name}")
          # Invariants from both PRs must survive the three-way resolution.
          runs = Path("capstone-code/capstone/api/runs.py").read_text()
          for token in (
              "SafeRequirementProgress", "SAFE_STAGE_FIELDS",
              'progress["latest"]', "requirement_statuses_truncated",
              "latest_observed",
          ):
              if token not in runs:
                  raise SystemExit("Lost PR293/PR294 contract: " + token)
          PY
            git add -- capstone-code/capstone/api/runs.py frontend/src/pages/managed.tsx frontend/src/types.ts tests/test_web_runs.py
          fi
          unresolved=$(git diff --name-only --diff-filter=U)
          test -z "$unresolved" || { echo "Unresolved paths: $unresolved"; exit 1; }
          # Check source conflicts only: merged main includes intentionally formatted Markdown hard breaks.
          git diff --cached --check -- capstone-code/capstone/api/runs.py frontend/src/pages/managed.tsx frontend/src/types.ts tests/test_web_runs.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'merge(main): preserve PR293 durable journal and PR294 typed progress contracts'
          git diff --check HEAD^1..HEAD -- capstone-code/capstone/api/runs.py frontend/src/pages/managed.tsx frontend/src/types.ts tests/test_web_runs.py
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
      - run: uv python install
      - run: uv sync --locked --all-extras
      - run: uv pip install --python .venv/bin/python -r frontend/requirements-api.txt
      - name: Targeted source-matched evidence for inventory (full CI remains separate)
        shell: bash
        run: |
          set -euo pipefail
          # Build real per-test coverage/JUnit evidence without rerunning all
          # 3,000+ tests; the final CI gates full-suite verification.
          uv run --no-sync pytest -q \
            tests/test_web_runs.py::test_typed_stage_projection_excludes_agent_internals \
            tests/test_web_runs.py::test_render_progress_contract_rejects_secret_fields_and_free_text \
            tests/test_run_repository.py::test_execution_config_excludes_secrets_and_invalid_strategy \
            tests/test_run_repository.py::test_event_contract_refuses_unapproved_fields \
            --cov=capstone --cov=evaltools --cov-context=test \
            --junitxml=junit.xml --cov-report=term-missing
      - name: Build coverage-backed source-matched inventory
        run: cd evaluation && uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Verify rebuilt inventory against merged Python sources
        run: uv run --no-sync pytest -q tests/test_full_evaluation.py::test_the_repository_has_no_unexplained_python_file
      - name: Commit inventories and delete this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=feature/render-safe-complete-triage-progress-20261117
          remote_head=$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')
          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$remote_head" = "$GITHUB_SHA" || {
            echo 'PR294 branch changed during testing; refusing stale inventory commit'
            exit 1
          }
          test "$remote_main" = "$MAIN_BASE_SHA" || {
            echo 'Main moved during testing; refusing to commit stale reconciliation'
            exit 1
          }
          rm .github/workflows/pr294-inventory-refresh.yml
          git add -A -- evaluation/inventory/ .github/workflows/pr294-inventory-refresh.yml
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(eval): refresh source-matched PR 294 inventories'
          git push origin HEAD:refs/heads/"$branch"
