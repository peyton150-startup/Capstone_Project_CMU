# One-time evaluator snapshot for PR291. Delete after committing artifacts.
name: Rebuild PR291 evaluation inventory

on:
  push:
    branches:
      - feature/siemens-supabase-ingest-oem-manuals
    paths:
      - ".github/workflows/rebuild-pr291-inventory.yml"

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild and verify inventories
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - run: uv python install
      - run: uv sync --locked --all-extras
      - run: uv pip install --python .venv/bin/python -r frontend/requirements-api.txt
      - name: Gather initial complete test coverage
        run: |
          uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test --junitxml=junit.xml --cov-report=term-missing || true
      - name: Rebuild canonical evaluator inventories
        run: |
          cd evaluation
          uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - name: Verify complete test suite against new inventories
        run: |
          uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test --junitxml=junit.xml --cov-report=term-missing
      - name: Rebuild inventories using passing test evidence
        run: |
          cd evaluation
          uv run --no-sync python -m evaltools.build_inventory --coverage ../.coverage --junit ../junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: pr291-inventory-rebuilt
          if-no-files-found: error
          retention-days: 1
          path: |
            evaluation/inventory/FUNCTION_INVENTORY.json
            evaluation/inventory/TEST_INVENTORY.json
            evaluation/inventory/TOOL_INVENTORY.json
            evaluation/inventory/VERIFICATION_MATRIX.json

  commit:
    name: Commit PR291 evaluator inventories
    needs: rebuild
    if: github.ref == 'refs/heads/feature/siemens-supabase-ingest-oem-manuals'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/siemens-supabase-ingest-oem-manuals
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: pr291-inventory-rebuilt
          path: ${{ runner.temp }}/inventory
      - name: Commit only inventories on exact source revision
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Branch changed after inventory run; refuse stale snapshot"
            exit 0
          fi
          for name in FUNCTION_INVENTORY.json TEST_INVENTORY.json TOOL_INVENTORY.json VERIFICATION_MATRIX.json; do
            source="$RUNNER_TEMP/inventory/evaluation/inventory/$name"
            if [ ! -f "$source" ]; then source="$RUNNER_TEMP/inventory/$name"; fi
            test -f "$source"
            python -m json.tool "$source" >/dev/null
            cp "$source" "evaluation/inventory/$name"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evaluation/inventory/FUNCTION_INVENTORY.json evaluation/inventory/TEST_INVENTORY.json evaluation/inventory/TOOL_INVENTORY.json evaluation/inventory/VERIFICATION_MATRIX.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evaluation: rebuild inventory for live pilot and OEM changes"
          git push origin HEAD:refs/heads/feature/siemens-supabase-ingest-oem-manuals
