name: Temporary triage evaluation inventory sync
on:
  push:
    branches:
      - integration/triage-deterministic-20261113

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Wait for the composite full-test inventory artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 160); do
            artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/43529406282/artifacts" --jq '.artifacts[] | select(.name=="evaluator-inventory") | .id')
            if [[ -n "$artifact_id" ]]; then
              echo "Found generated inventory: $artifact_id"
              exit 0
            fi
            sleep 15
          done
          echo "Composite CI did not produce an inventory artifact"
          exit 1
      - name: Fetch the generated inventories
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43529406282 --name evaluator-inventory --dir evaluation/inventory
      - name: Commit inventories and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-triage-inventory-sync.yml
          git add evaluation/inventory/FUNCTION_INVENTORY.json evaluation/inventory/TEST_INVENTORY.json evaluation/inventory/TOOL_INVENTORY.json evaluation/inventory/VERIFICATION_MATRIX.json
          git commit -m "Regenerate composite triage evaluator inventory from full CI" 
          git push origin HEAD:integration/triage-deterministic-20261113
