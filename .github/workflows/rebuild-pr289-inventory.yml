name: Rebuild PR289 evaluation inventory

on:
  push:
    branches:
      - feature/supabase-postgres-simulator-journal
    paths:
      - ".github/workflows/rebuild-pr289-inventory.yml"

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - run: uv python install
      - run: uv sync --locked --all-extras
      - run: uv pip install --python .venv/bin/python -r frontend/requirements-api.txt
      - name: Collect complete coverage even when stale inventory test fails
        run: |
          uv run --no-sync pytest --cov=capstone --cov=evaltools --cov-context=test \
            --junitxml=junit.xml --cov-report=term-missing || true
      - name: Rebuild all four canonical evaluation inventories
        run: |
          cd evaluation
          uv run --no-sync python -m evaltools.build_inventory \
            --coverage ../.coverage --junit ../junit.xml
      - name: Print bounded inventory chunks for reviewed PR branch update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("evaluation/inventory")
          for name in (
              "FUNCTION_INVENTORY.json",
              "TEST_INVENTORY.json",
              "TOOL_INVENTORY.json",
              "VERIFICATION_MATRIX.json",
          ):
              content = (root / name).read_text(encoding="utf-8")
              chunks = [content[n:n+9000] for n in range(0, len(content), 9000)]
              for i, chunk in enumerate(chunks):
                  print("@@CAPSTONE_INVENTORY@@ " + json.dumps(
                      {"file": name, "part": i, "count": len(chunks), "data": chunk},
                      separators=(",", ":"),
                  ))
          PY
