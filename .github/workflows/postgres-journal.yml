name: PostgreSQL simulator journal

on:
  pull_request:
    paths:
      - "capstone-code/capstone/api/**"
      - "migrations/**"
      - "tests/test_postgres_journal.py"
      - "tests/test_migrations.py"
      - ".github/workflows/postgres-journal.yml"
  push:
    branches: [main]
    paths:
      - "capstone-code/capstone/api/**"
      - "migrations/**"
      - "tests/test_postgres_journal.py"
      - "tests/test_migrations.py"
      - ".github/workflows/postgres-journal.yml"

permissions:
  contents: read

jobs:
  journal:
    name: TLS Postgres 17 run journal acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPSTONE_TEST_POSTGRES_URL: postgresql://postgres:capstone-test@127.0.0.1:5432/capstone_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - run: uv python install
      - name: Install pinned dependencies
        run: uv sync --locked --all-extras
      - name: Start disposable TLS PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postgres-tls"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=localhost' \
            -keyout "$RUNNER_TEMP/postgres-tls/server.key" \
            -out "$RUNNER_TEMP/postgres-tls/server.crt" >/dev/null 2>&1
          sudo chown 999:999 "$RUNNER_TEMP/postgres-tls/server.key"
          chmod 600 "$RUNNER_TEMP/postgres-tls/server.key"
          chmod 644 "$RUNNER_TEMP/postgres-tls/server.crt"
          docker run --rm -d --name capstone-test-postgres \
            -e POSTGRES_PASSWORD=capstone-test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=capstone_test \
            -p 127.0.0.1:5432:5432 \
            -v "$RUNNER_TEMP/postgres-tls/server.key:/etc/postgresql/server.key:ro" \
            -v "$RUNNER_TEMP/postgres-tls/server.crt:/etc/postgresql/server.crt:ro" \
            postgres:17 \
            -c ssl=on -c ssl_cert_file=/etc/postgresql/server.crt \
            -c ssl_key_file=/etc/postgresql/server.key
          for n in $(seq 1 45); do
            if docker exec capstone-test-postgres pg_isready -U postgres -d capstone_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs capstone-test-postgres
          exit 1
      - name: Migration, concurrency, idempotency and artifact recovery
        run: uv run --no-sync pytest tests/test_migrations.py tests/test_postgres_journal.py -q
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker stop capstone-test-postgres || true
